[pytest]
testpaths = tests
# Los e2e (tests/e2e) le pegan a una API levantada: no corren con "pytest" solo,
# sino con tests/e2e/correr.sh. La cobertura se mide sobre app/.
addopts = -m "not e2e" --cov=app --cov-report=term-missing
markers =
    e2e: tests end-to-end contra la API levantada (ver docs/testing.md)
