[pytest]
testpaths = tests
# Los e2e (tests/e2e) le pegan a una API levantada: no corren con "pytest" solo,
# sino con tests/e2e/correr.sh. La cobertura se mide sobre app/.
addopts = -m "not e2e" --cov=app --cov-report=term-missing
markers =
    e2e: tests end-to-end contra la API levantada (ver docs/testing.md)
# firebase-admin 7.7.0 marca como obsoleto MulticastMessage(tokens=...) y sugiere "fids",
# pero los fids no son el token de onNewToken que manda la app: con fids el push dejaría
# de llegar. Se silencia solo ese aviso (ver T30 en docs/decisiones.md).
filterwarnings =
    ignore:MulticastMessage\.tokens is deprecated\. Use MulticastMessage\.fids instead\.:DeprecationWarning
